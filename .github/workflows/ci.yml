name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate source scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate JS (syntax + JSON-wrapper guard)
        run: npm run validate
      - name: Render smoke test (headless jsdom)
        run: npm run smoke
