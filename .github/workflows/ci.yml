name: CI

on:
  push:
  pull_request:

# Supersede older runs on the same ref instead of letting them pile up and
# saturate the runner pool. A hung run no longer blocks every later push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source scripts
    runs-on: ubuntu-latest
    # Hard ceiling so a hung test can never occupy a runner for hours.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate JS (syntax + JSON-wrapper guard)
        run: npm run validate
      - name: Render smoke test (headless jsdom)
        run: npm run smoke
