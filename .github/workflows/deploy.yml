name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# This app is a Next.js server (auth, middleware, M-Pesa webhook).
# GitHub Pages can only host static files, and publishing the repo root
# removed index.html and 404'd the Pages site. Production is Vercel.
# This workflow only checks the app. It does not upload a Pages artifact.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Test and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
