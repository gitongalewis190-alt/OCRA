<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">OCRA analytics illustration</title>
  <desc id="heroDesc">A wireframe globe built from connected nodes, with three rising data series and a faint grid, drawn in ocean blue on a light background.</desc>

  <defs>
    <radialGradient id="bg" cx="52%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#f7fbfe"/>
      <stop offset="62%" stop-color="#e6eef5"/>
      <stop offset="100%" stop-color="#d5e0ea"/>
    </radialGradient>
    <radialGradient id="globe" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="58%" stop-color="#cfe6f6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8fc2e2" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E6BA8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0E6BA8" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#0E6BA8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <rect width="900" height="1100" fill="url(#grid)"/>

  <!-- soft light pools -->
  <ellipse cx="430" cy="360" rx="250" ry="250" fill="#ffffff" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="560" cy="700" rx="200" ry="180" fill="#38BDF8" opacity="0.10" filter="url(#soft)"/>

  <!-- orbit rings -->
  <circle cx="450" cy="470" r="322" fill="none" stroke="#0E6BA8" stroke-opacity="0.16" stroke-width="1.4" stroke-dasharray="3 9"/>
  <circle cx="450" cy="470" r="252" fill="none" stroke="#0E6BA8" stroke-opacity="0.24" stroke-width="1.6"/>

  <!-- globe -->
  <circle cx="450" cy="470" r="196" fill="url(#globe)" stroke="#0E6BA8" stroke-opacity="0.5" stroke-width="1.8"/>

  <!-- meridians -->
  <g fill="none" stroke="#0E6BA8" stroke-opacity="0.30" stroke-width="1.3">
    <ellipse cx="450" cy="470" rx="196" ry="66"/>
    <ellipse cx="450" cy="470" rx="150" ry="196"/>
    <ellipse cx="450" cy="470" rx="86" ry="196"/>
    <ellipse cx="450" cy="470" rx="196" ry="130"/>
    <path d="M450 274v392"/>
    <path d="M254 470h392"/>
  </g>

  <!-- latitude arcs -->
  <g fill="none" stroke="#0E6BA8" stroke-opacity="0.16" stroke-width="1">
    <path d="M290 372q160 -48 320 0"/>
    <path d="M272 470q178 -30 356 0"/>
    <path d="M290 568q160 48 320 0"/>
  </g>

  <!-- network nodes -->
  <g stroke="#0E6BA8" stroke-opacity="0.34" stroke-width="1.1" fill="none">
    <path d="M450 274 610 372 610 568 450 666 290 568 290 372Z"/>
    <path d="M450 274v392M290 372l320 196M610 372 290 568"/>
  </g>
  <g fill="#0E6BA8">
    <circle cx="450" cy="274" r="6.5"/>
    <circle cx="610" cy="372" r="5.5"/>
    <circle cx="610" cy="568" r="5.5"/>
    <circle cx="450" cy="666" r="6.5"/>
    <circle cx="290" cy="568" r="5.5"/>
    <circle cx="290" cy="372" r="5.5"/>
  </g>
  <g fill="#F5B301">
    <circle cx="450" cy="274" r="2.6"/>
    <circle cx="450" cy="666" r="2.6"/>
  </g>
  <g fill="#38BDF8" opacity="0.85">
    <circle cx="610" cy="372" r="2.4"/>
    <circle cx="290" cy="568" r="2.4"/>
  </g>

  <!-- satellite nodes -->
  <g fill="#0E6BA8" opacity="0.55">
    <circle cx="196" cy="212" r="4"/><circle cx="726" cy="268" r="3.4"/>
    <circle cx="774" cy="512" r="4.4"/><circle cx="150" cy="606" r="3.6"/>
    <circle cx="196" cy="792" r="3"/><circle cx="700" cy="812" r="4"/>
    <circle cx="342" cy="176" r="2.8"/><circle cx="804" cy="700" r="2.6"/>
  </g>
  <g stroke="#0E6BA8" stroke-opacity="0.16" stroke-width="1">
    <path d="M196 212 290 372M726 268 610 372M774 512 610 568M150 606 290 568M196 792 290 568M700 812 610 568M342 176 450 274M804 700 610 568"/>
  </g>

  <!-- rising reports panel -->
  <g transform="translate(258 742)">
    <rect x="0" y="0" width="384" height="196" rx="16" fill="#ffffff" fill-opacity="0.82" stroke="#ffffff" stroke-width="1.4"/>
    <rect x="0.7" y="0.7" width="382.6" height="194.6" rx="15.4" fill="none" stroke="#0E6BA8" stroke-opacity="0.16"/>

    <g stroke="#0E6BA8" stroke-opacity="0.10">
      <path d="M24 44h336M24 84h336M24 124h336M24 164h336"/>
    </g>

    <path d="M24 156 96 132 168 140 240 96 312 74 360 52" fill="none" stroke="#0E6BA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 156 96 132 168 140 240 96 312 74 360 52V176H24Z" fill="url(#rise)" opacity="0.5"/>

    <path d="M24 168 96 158 168 150 240 138 312 126 360 112" fill="none" stroke="#F5B301" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>

    <g fill="#ffffff" stroke="#0E6BA8" stroke-width="2.4">
      <circle cx="96" cy="132" r="4.4"/><circle cx="168" cy="140" r="4.4"/>
      <circle cx="240" cy="96" r="4.4"/><circle cx="312" cy="74" r="4.4"/>
    </g>
    <g fill="#F5B301">
      <circle cx="240" cy="138" r="3"/><circle cx="312" cy="126" r="3"/>
    </g>

    <text x="24" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0E6BA8" fill-opacity="0.75">RESULTS ACROSS TERMS</text>
  </g>

  <!-- six dimension ticks -->
  <g transform="translate(450 986)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#0E6BA8" fill-opacity="0.66" letter-spacing="1.2" text-anchor="middle">
    <text x="-190" y="0">SPATIAL</text>
    <text x="-114" y="0">NUMERICAL</text>
    <text x="-38" y="0">LANGUAGE</text>
    <text x="38" y="0">LOGIC</text>
    <text x="114" y="0">MECHANICAL</text>
    <text x="190" y="0">FOCUS</text>
  </g>
  <g transform="translate(450 1008)" fill="#0E6BA8" fill-opacity="0.35">
    <rect x="-198" y="0" width="16" height="3" rx="1.5"/>
    <rect x="-122" y="0" width="16" height="3" rx="1.5"/>
    <rect x="-46" y="0" width="16" height="3" rx="1.5"/>
    <rect x="30" y="0" width="16" height="3" rx="1.5"/>
    <rect x="106" y="0" width="16" height="3" rx="1.5"/>
    <rect x="182" y="0" width="16" height="3" rx="1.5"/>
  </g>
</svg>
